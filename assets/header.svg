<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="dirtycow0 - cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101a14"/>
      <stop offset="100%" stop-color="#0a1f12"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#39ff14" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#39ff14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#39ff14" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="880" height="200" fill="url(#bg)"/>
  <rect width="880" height="200" fill="url(#grid)"/>

  <!-- moving scan sweep -->
  <rect x="0" y="0" width="260" height="200" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate"
                      from="-280 0" to="900 0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- prompt -->
  <text x="46" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" fill="#7ee787" letter-spacing="1.5">&gt; ./whoami</text>

  <!-- glow behind the name -->
  <text x="44" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="74" font-weight="700" fill="#39ff14" filter="url(#glow)" letter-spacing="1">dirtycow0
    <animate attributeName="opacity" values="0.30;0.80;0.30" dur="3.4s" repeatCount="indefinite"/>
  </text>

  <!-- the name -->
  <text x="44" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="74" font-weight="700" fill="#39ff14" letter-spacing="1">dirtycow0</text>

  <!-- blinking cursor -->
  <rect x="445" y="94" width="30" height="46" fill="#39ff14">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="46" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16" fill="#8b949e" letter-spacing="3.5">cybersecurity &#183; self-taught &#183; 17</text>

  <rect x="0" y="197" width="880" height="3" fill="url(#rule)"/>
</svg>
